// ---------- Traductor automático de nombres de producto ----------
// Traduce palabra por palabra usando el diccionario de arriba. Preserva sin tocar
// todo lo que no sea una palabra reconocida: marcas, medidas (mm, V, W, kWh),
// códigos de modelo (H07V-K, SDS-Plus, CEM II), y números — porque esos son iguales
// en cualquier idioma. Así, CUALQUIER producto (incluso los generados automáticamente
// por generarVariantes) se traduce solo, sin tener que escribir el nombre en 3 idiomas.
function traducirPalabra(palabra, diccionario) {
  const clave = palabra.toLowerCase();
  const traduccion = diccionario[clave];
  if (!traduccion) return palabra; // no está en el diccionario: se deja igual (marca, código, etc.)
  const primeraMayuscula = palabra[0] !== palabra[0].toLowerCase();
  return primeraMayuscula ? traduccion.charAt(0).toUpperCase() + traduccion.slice(1) : traduccion;
}

const COLORES_EXTERIOR = {
  "Blanco": "#FFFFFF",

  "Beige": "#E3D3B4",
  "Gris perla": "#D6D6D2",
  "Terracota": "#C06B4B",
};
// Paleta combinada, usada por el punto de color de cada tarjeta de producto
// (funciona para Interior y Exterior sin importar cuál esté activa)
const COLORES_PINTURA = { ...COLORES_INTERIOR, ...COLORES_EXTERIOR };
function colorDePintura(nombre) {
  const partes = nombre.split("—");
  const clave = partes.length > 1 ? partes[1].trim() : null;
  return clave ? COLORES_PINTURA[clave] : null;
}

function traducirTexto(texto, idioma) {
  if (idioma === "es" || !texto) return texto;
  const diccionario = idioma === "fr" ? DICCIONARIO_FR : DICCIONARIO_EN;
  return texto
    .split(/(\s+|[,()/])/)
    .map((token) => (/^[A-Za-zÀ-ÿ]+$/.test(token) ? traducirPalabra(token, diccionario) : token))
    .join("");
}

// ---------- Generador de variantes ----------
// Crea varios productos a partir de UNA plantilla, cambiando solo el dato que varía
// (calibre, diámetro, potencia, etc). Sirve para escalar el catálogo sin escribir
// cada producto a mano, y es el mismo mecanismo que luego puede leer una lista de
// precios de un proveedor real y generar sus variantes automáticamente.
function generarVariantes({ idBase, pais, cat, sub, marca, nombreTemplate, unidadTemplate, refPrefix, valores }) {
  return valores.map((valor, i) => ({
    id: idBase + i,
    pais,
    cat,
    sub,
    marca,
    nombre: nombreTemplate.replace("{valor}", valor),
    unidad: typeof unidadTemplate === "function" ? unidadTemplate(valor) : unidadTemplate,
    ref: `${refPrefix}-${String(idBase + i).padStart(4, "0")}`,
  }));
}

const PRODUCTOS = [...PRODUCTOS_BASE, ...VARIANTES_GENERADAS];

// Orden de pasos del flujo principal de cotización (proyecto -> materiales -> plazo -> contacto -> foto)
const PASOS = ["cliente", "proyecto", "materiales", "plazo", "contacto", "foto"];

function PlataformaCotizacion() {
  const [idioma, setIdioma] = React.useState("es");
  const t = T[idioma];
  const [mercado, setMercado] = React.useState("ES");
  const productosDisponibles = React.useMemo(
    () => PRODUCTOS.filter((p) => p.pais === "ambos" || p.pais === mercado),
    [mercado]
  );
  
  // Extraer marcas únicas y ordenarlas alfabéticamente
  const marcasUnicas = React.useMemo(() => {
    const marcas = [...new Set(productosDisponibles.map(p => p.marca))];
    return marcas.sort();
  }, [productosDisponibles]);
  
  // Estado para navegación por marca
  const [marcaSeleccionada, setMarcaSeleccionada] = React.useState(null);
  const [tipoProductoSeleccionado, setTipoProductoSeleccionado] = React.useState(null);
  
  // Productos de la marca seleccionada, agrupados por tipo (subcategoría + nombre base)
  const productosDelaMarca = React.useMemo(() => {
    if (!marcaSeleccionada) return [];
    return productosDisponibles.filter(p => p.marca === marcaSeleccionada);
  }, [marcaSeleccionada, productosDisponibles]);
  
  // Agrupar por "tipo" (nombre sin el valor variable)
  const tiposDeProducto = React.useMemo(() => {
    if (!productosDelaMarca.length) return [];
    const tipos = {};
    productosDelaMarca.forEach(p => {
      const key = p.sub; // Usar subcategoría como agrupador
      if (!tipos[key]) tipos[key] = [];
      tipos[key].push(p);
    });
    // Ordenar variantes de cada tipo de mayor a menor (extrayendo número)
    Object.keys(tipos).forEach(key => {
      tipos[key].sort((a, b) => {
        const numA = parseFloat(a.nombre) || 0;
        const numB = parseFloat(b.nombre) || 0;
        return numB - numA; // Mayor a menor
      });
    });
    return tipos;
  }, [productosDelaMarca]);
  const [busqueda, setBusqueda] = React.useState("");
  const [listaCotizacion, setListaCotizacion] = React.useState({});
  const [panelAbierto, setPanelAbierto] = React.useState(false);
  const [carritoAbierto, setCarritoAbierto] = React.useState(false);
  const [pasoActual, setPasoActual] = React.useState(0);
  const [enviado, setEnviado] = React.useState(false);
  const [catExpandida, setCatExpandida] = React.useState(null);
  const [grupoActivo, setGrupoActivo] = React.useState("materiales"); // "materiales" o "herramientas"
  const [marcasAbierto, setMarcasAbierto] = React.useState(false);
  const [subActiva, setSubActiva] = React.useState({});

  // ---------- Cotizaciones (VISTA PREVIA: en memoria acá; los archivos HTML reales usan Firebase) ----------
  // ---------- Sistema de cotizaciones: base de datos real en la nube (Firebase) ----------
  const [cotizaciones, setCotizaciones] = React.useState([]);
  React.useEffect(() => {
    const dejarDeEscuchar = db
      .collection("cotizaciones")
      .orderBy("fecha", "desc")
      .onSnapshot(
        (snapshot) => {
          const datos = snapshot.docs.map((doc) => ({ id: doc.id, ...doc.data() }));
          setCotizaciones(datos);
        },
        (error) => console.error("Error conectando con Firebase:", error)
      );
    return () => dejarDeEscuchar();
  }, []);

  const [misCotizacionesAbierto, setMisCotizacionesAbierto] = React.useState(false);
  const [cotizacionExpandida, setCotizacionExpandida] = React.useState(null);
  const [verDetalleCompleto, setVerDetalleCompleto] = React.useState(null); // guarda el objeto cotización completo
  const [mensajeReporte, setMensajeReporte] = React.useState("");
  const [reporteEnviado, setReporteEnviado] = React.useState(false);
  const [numeroPedidoReporte, setNumeroPedidoReporte] = React.useState("");
  const [reporteError, setReporteError] = React.useState(false);
  const [areaClienteAbierta, setAreaClienteAbierta] = React.useState(false);
  const [clienteSesion, setClienteSesion] = React.useState(false);
  const [numeroClienteInput, setNumeroClienteInput] = React.useState("");
  const [buscarClienteDato, setBuscarClienteDato] = React.useState("");

  const [proyecto, setProyecto] = React.useState({ tipo: "", zona: "" });
  const [plazo, setPlazo] = React.useState("");
  const [clienteInfo, setClienteInfo] = React.useState({ modo: null, numero: "" });
  const [numeroClienteConfirmado, setNumeroClienteConfirmado] = React.useState("");
  const [contacto, setContacto] = React.useState({
    tipoCliente: "Particular",
    empresaNombre: "",
    nombre: "",
    telefono: "",
    celular: "",
    email: "",
    medio: "",
    dato: "",
    direccion: "",
    cp: "",
    diaRequerido: "",
  });
  const [foto, setFoto] = React.useState(null);
  const [pidiendoExtra, setPidiendoExtra] = React.useState(false);
  const [productoExtra, setProductoExtra] = React.useState("");
  const [extras, setExtras] = React.useState([]);

  function agregarExtra() {
    if (!productoExtra.trim()) return;
    setExtras((prev) => [...prev, productoExtra.trim()]);
    setProductoExtra("");
    setPidiendoExtra(false);
  }

  function quitarExtra(i) {
    setExtras((prev) => prev.filter((_, idx) => idx !== i));
  }

  const buscando = busqueda.trim().length > 0;

  const resultadosBusqueda = React.useMemo(() => {
    if (!buscando) return [];
    const q = busqueda.toLowerCase();
    return productosDisponibles.filter((p) => p.nombre.toLowerCase().includes(q) || p.marca.toLowerCase().includes(q));
  }, [busqueda, buscando, productosDisponibles]);

  const items = Object.entries(listaCotizacion)
    .map(([id, cant]) => {
      const producto = PRODUCTOS.find((p) => p.id === Number(id));
      return producto ? { ...producto, cantidad: cant } : null;
    })
    .filter(Boolean);

  const totalItems = items.reduce((acc, i) => acc + i.cantidad, 0);

  function agregar(id) {
    setListaCotizacion((prev) => ({ ...prev, [id]: (prev[id] || 0) + 1 }));
  }

  function cambiarCantidad(id, delta) {
    setListaCotizacion((prev) => {
      const nueva = (prev[id] || 0) + delta;
      if (nueva <= 0) {
        const { [id]: _, ...resto } = prev;
        return resto;
      }
      return { ...prev, [id]: nueva };
    });
  }

  function abrirFlujo() {
    setPasoActual(0);
    setPanelAbierto(true);
    setMarcaSeleccionada(null);
    setTipoProductoSeleccionado(null);
  }

  function siguientePaso() {
    setPasoActual((p) => Math.min(p + 1, PASOS.length - 1));
  }

  function pasoAnterior() {
    setPasoActual((p) => Math.max(p - 1, 0));
  }

  function enviarSolicitud() {
    try {
      const soloDigitos = (contacto.celular || contacto.telefono || "").replace(/\D/g, "");
      const numeroClienteFinal =
        clienteInfo.modo === "existente" && clienteInfo.numero.trim() !== ""
          ? clienteInfo.numero.trim()
          : soloDigitos
          ? `OM-${soloDigitos}`
          : "";
      if (clienteInfo.modo === "nuevo" && numeroClienteFinal) setNumeroClienteConfirmado(numeroClienteFinal);
      const nuevaCotizacion = {
        fecha: new Date().toISOString(),
        clienteNumero: numeroClienteFinal,
        proyecto: { tipo: proyecto.tipo || "", zona: proyecto.zona || "" },
        plazo: plazo || "",
        contacto: {
          tipoCliente: contacto.tipoCliente || "Particular",
          empresaNombre: contacto.empresaNombre || "",
          nombre: contacto.nombre || "",
          telefono: contacto.telefono || "",
          celular: contacto.celular || "",
          email: contacto.email || "",
          medio: contacto.medio || "",
          dato: contacto.celular || contacto.telefono || contacto.email || "",
          direccion: contacto.direccion || "",
          cp: contacto.cp || "",
          diaRequerido: contacto.diaRequerido || "",
        },
        items: items.map((i) => ({
          id: i.id ?? null,
          nombre: i.nombre || "",
          marca: i.marca || "",
          unidad: i.unidad || "",
          cantidad: i.cantidad ?? 1,
        })),
        extras: [...extras],
        estado: "enviada", // enviada -> respondida -> aceptada -> pagada -> entregado
        precioTotal: null,
        notasAdmin: "",
      };
      db.collection("cotizaciones")
        .add(nuevaCotizacion)
        .then(() => {
          setBuscarClienteDato(nuevaCotizacion.contacto.dato || nuevaCotizacion.contacto.nombre || "");
        })
        .catch((error) => console.error("Error guardando cotización en Firebase:", error));
      setEnviado(true);
      setTimeout(() => {
        try {
          setEnviado(false);
          setListaCotizacion({});
          setProyecto({ tipo: "", zona: "" });
          setPlazo("");
          setContacto({
            tipoCliente: "Particular",
            empresaNombre: "",
            nombre: "",
            telefono: "",
            celular: "",
            email: "",
            medio: "",
            dato: "",
            direccion: "",
            cp: "",
            diaRequerido: "",
          });
          setFoto(null);
          setExtras([]);
          setPanelAbierto(false);
        } catch (error) {
          console.error("Error al reiniciar el formulario tras enviar:", error);
          setEnviado(false);
          setPanelAbierto(false);
        }
      }, 2800);
    } catch (error) {
      console.error("Error enviando la solicitud:", error);
      setEnviado(false);
    }
  }

  function aceptarCotizacion(id) {
    db.collection("cotizaciones").doc(id).update({ estado: "aceptada" })
      .catch((error) => console.error("Error aceptando cotización:", error));
  }

  function pagarCotizacion(id) {
    // DEMO: aquí es donde se conectaría Stripe/PayPal en producción.
    db.collection("cotizaciones").doc(id).update({ estado: "pagada" })
      .catch((error) => console.error("Error registrando el pago:", error));
  }

  function enviarReporte(id, texto) {
    if (!texto.trim()) return;
    const nuevoReporte = { texto: texto.trim(), fecha: new Date().toISOString() };
    const actual = cotizaciones.find((c) => c.id === id);
    const reportesActuales = (actual && actual.reportes) || [];
    db.collection("cotizaciones").doc(id).update({ reportes: [...reportesActuales, nuevoReporte] })
      .then(() => {
        setVerDetalleCompleto((prev) => (prev && prev.id === id ? { ...prev, reportes: [...reportesActuales, nuevoReporte] } : prev));
        setMensajeReporte("");
        setReporteEnviado(true);
        setTimeout(() => setReporteEnviado(false), 2500);
      })
      .catch((error) => console.error("Error enviando el mensaje:", error));
  }

  function enviarReporteSimple() {
    const num = numeroPedidoReporte.trim();
    if (!num || !mensajeReporte.trim()) return;
    const candidatos = cotizaciones
      .filter((c) => c.clienteNumero === num || c.id === num || c.numeroFactura === num)
      .sort((a, b) => new Date(b.fecha) - new Date(a.fecha));
    if (candidatos.length === 0) {
      setReporteError(true);
      setTimeout(() => setReporteError(false), 3000);
      return;
    }
    setReporteError(false);
    enviarReporte(candidatos[0].id, mensajeReporte);
    setNumeroPedidoReporte("");
  }

  const puedeAvanzar = [
    clienteInfo.modo === "nuevo" || (clienteInfo.modo === "existente" && clienteInfo.numero.trim() !== ""),
    proyecto.tipo && proyecto.zona.trim(),
    items.length > 0 || extras.length > 0,
    plazo,
    contacto.nombre.trim() &&
      (contacto.telefono.trim() || contacto.celular.trim() || contacto.email.trim()) &&
      (contacto.direccion || "").trim() &&
      (contacto.cp || "").trim(),
    true,
  ];

  return (
    <div style={{ fontFamily: F_BODY, background: COLOR.fondo, minHeight: "100vh", color: COLOR.grafito, paddingBottom: 90 }}>
      {/* ---------- Barra superior ---------- */}
      <header
        style={{
          background: COLOR.grafito,
          color: COLOR.fondo,
          padding: "16px 20px",
        }}
      >
        <div style={{ display: "flex", alignItems: "center", gap: 14, maxWidth: 980, margin: "0 auto" }}>
          <div style={{ fontFamily: F_DISPLAY, fontWeight: 900, fontSize: 24, letterSpacing: 0.3, whiteSpace: "nowrap" }}>
            DEPO<span style={{ color: COLOR.amarillo }}>MARKET</span>
          </div>
          <div style={{ flex: 1, position: "relative" }}>
            <input
              value={busqueda}
              onChange={(e) => {
                setBusqueda(e.target.value);
                if (e.target.value.trim()) {
                  setMarcaSeleccionada(null);
                  setTipoProductoSeleccionado(null);
                }
              }}
              placeholder={t.buscarPlaceholder}
              style={{
                width: "100%",
                padding: "11px 14px",
                border: "none",
                borderRadius: 8,
                fontSize: 14.5,
                outline: "none",
                background: COLOR.tarjeta,
                color: COLOR.grafito,
                boxSizing: "border-box",
              }}
            />
          </div>
          <div style={{ display: "flex", gap: 4, flexShrink: 0 }}>
            {IDIOMAS.map((i) => (
              <button
                key={i.id}
                onClick={() => setIdioma(i.id)}
                style={{
                  padding: "7px 10px",
                  fontSize: 12,
                  fontWeight: 800,
                  borderRadius: 6,
                  border: "none",
                  cursor: "pointer",
                  background: idioma === i.id ? COLOR.amarillo : "rgba(237,228,211,0.15)",
                  color: idioma === i.id ? COLOR.grafito : COLOR.fondo,
                }}
              >
                {i.etiqueta}
              </button>
            ))}
          </div>
        </div>
        <div style={{ display: "flex", justifyContent: "flex-end", gap: 4, maxWidth: 980, margin: "8px auto 0" }}>
          {MERCADOS.map((m) => (
            <button
              key={m.id}
              onClick={() => setMercado(m.id)}
              style={{
                padding: "6px 10px",
                fontSize: 12,
                fontWeight: 700,
                borderRadius: 6,
                border: `1px solid ${mercado === m.id ? COLOR.amarillo : "rgba(237,228,211,0.25)"}`,
                cursor: "pointer",
                background: mercado === m.id ? "rgba(245,183,0,0.15)" : "transparent",
                color: COLOR.fondo,
              }}
            >
              {m.etiqueta}
            </button>
          ))}
        </div>
        <div style={{ display: "flex", justifyContent: "flex-end", gap: 8, maxWidth: 980, margin: "8px auto 0" }}>
          {clienteSesion ? (
            <button
              onClick={() => setMisCotizacionesAbierto(true)}
              style={{
                padding: "6px 10px",
                fontSize: 11.5,
                fontWeight: 700,
                borderRadius: 6,
                border: "1px solid rgba(237,228,211,0.25)",
                cursor: "pointer",
                background: "transparent",
                color: COLOR.fondo,
              }}
            >
              📋 {idioma === "es" ? "Mis Cotizaciones" : idioma === "fr" ? "Mes Devis" : "My Quotes"}
            </button>
          ) : (
            <button
              onClick={() => setAreaClienteAbierta(true)}
              style={{
                padding: "6px 10px",
                fontSize: 11.5,
                fontWeight: 700,
                borderRadius: 6,
                border: `1px solid ${COLOR.amarillo}`,
                cursor: "pointer",
                background: "transparent",
                color: COLOR.amarillo,
              }}
            >
              🔑 {idioma === "es" ? "Área de Cliente" : idioma === "fr" ? "Espace Client" : "Client Area"}
            </button>
          )}
        </div>
      </header>

      {/* ---------- Hero cálido con fondo dinámico ---------- */}
      {!buscando && (

              <div style={{ fontSize: 14, color: COLOR.grafitoSuave, marginTop: 20, fontStyle: "italic", textAlign: "center" }}>
                {idioma === "es" ? "Todavía no tiene precio asignado — esperando respuesta." : "No price yet — waiting for response."}
              </div>
            )}

            {/* Dirección de entrega */}
            {verDetalleCompleto.contacto?.direccion && (
              <div style={{ marginTop: 28, background: COLOR.tarjeta, border: `1px solid ${COLOR.borde}`, borderRadius: 10, padding: 16 }}>
                <div style={{ fontSize: 12, fontWeight: 800, color: COLOR.grafitoSuave, textTransform: "uppercase", letterSpacing: 0.4, marginBottom: 4 }}>
                  {idioma === "es" ? "Dirección de entrega" : "Delivery address"}
                </div>
                <div style={{ fontSize: 15 }}>{verDetalleCompleto.contacto.direccion}{verDetalleCompleto.contacto.cp ? `, ${verDetalleCompleto.contacto.cp}` : ""}</div>
              </div>
            )}

            {/* Área de reporte: mensaje o problema con el pedido */}
            <div style={{ marginTop: 28, background: COLOR.tarjeta, border: `1px solid ${COLOR.borde}`, borderRadius: 10, padding: 16 }}>
              <div style={{ fontFamily: F_DISPLAY, fontWeight: 900, fontSize: 15, marginBottom: 4 }}>
                💬 {idioma === "es" ? "¿Algo no llegó bien o querés dejar un mensaje?" : idioma === "fr" ? "Un problème ou un message ?" : "Something wrong or a message?"}
              </div>
              <div style={{ fontSize: 12, color: COLOR.grafitoSuave, marginBottom: 10 }}>
                {idioma === "es" ? "Contanos si falta algo, llegó dañado, o cualquier duda sobre este pedido — lo vemos apenas lo mandes." : "Tell us if something's missing or damaged."}
              </div>

              {(verDetalleCompleto.reportes || []).length > 0 && (
                <div style={{ marginBottom: 10 }}>
                  {verDetalleCompleto.reportes.map((r, i) => (
                    <div key={i} style={{ background: COLOR.fondo, border: `1px solid ${COLOR.borde}`, borderRadius: 8, padding: 10, marginBottom: 6 }}>
                      <div style={{ fontSize: 10.5, color: COLOR.grafitoSuave, marginBottom: 2 }}>{new Date(r.fecha).toLocaleString()}</div>
                      <div style={{ fontSize: 13 }}>{r.texto}</div>
                    </div>
                  ))}
                </div>
              )}

              {reporteEnviado ? (
                <div style={{ textAlign: "center", padding: "10px 0", fontSize: 13, fontWeight: 800, color: "#2E7D32" }}>
                  ✓ {idioma === "es" ? "Mensaje enviado — te contactamos pronto" : "Message sent"}
                </div>
              ) : (
                <>
                  <textarea
                    value={mensajeReporte}
                    onChange={(e) => setMensajeReporte(e.target.value)}
                    placeholder={idioma === "es" ? "Ej: Falta 1 caja de tornillos, o el producto llegó golpeado…" : "Describe the issue…"}
                    rows={3}
                    style={{ width: "100%", padding: "10px 11px", border: `1px solid ${COLOR.borde}`, borderRadius: 8, fontSize: 13.5, boxSizing: "border-box", fontFamily: F_BODY, resize: "vertical", marginBottom: 8 }}
                  />
                  <button
                    onClick={() => enviarReporte(verDetalleCompleto.id, mensajeReporte)}
                    disabled={!mensajeReporte.trim()}
                    style={{ width: "100%", padding: "11px", background: mensajeReporte.trim() ? COLOR.grafito : COLOR.borde, color: mensajeReporte.trim() ? COLOR.fondo : COLOR.grafitoSuave, border: "none", borderRadius: 8, fontWeight: 800, fontSize: 13.5, cursor: mensajeReporte.trim() ? "pointer" : "default" }}
                  >
                    {idioma === "es" ? "Enviar mensaje" : idioma === "fr" ? "Envoyer" : "Send message"}
                  </button>
                </>
              )}
            </div>

            <button
              onClick={() => setVerDetalleCompleto(null)}
              style={{ width: "100%", marginTop: 20, padding: "14px", background: COLOR.amarillo, border: "none", borderRadius: 10, fontWeight: 800, fontSize: 15, cursor: "pointer", color: COLOR.grafito }}
            >
              {idioma === "es" ? "Volver" : idioma === "fr" ? "Retour" : "Back"}
            </button>
          </div>
        </div>
      )}

    </div>
  );
}

// ---------- Acordeón de categoría con subcategorías ----------

function CategoriaAcordeon({ categoria, idioma, t, abierta, subActiva, onToggle, onElegirSub, productos, productosDisponibles, listaCotizacion, onAgregar, onCambiar, onAgregarExtra }) {
  const subsMostrados = categoria.subs[idioma];
  const subsInternos = categoria.subs.es;
  return (
    <div style={{ marginBottom: 10, border: `1px solid ${COLOR.borde}`, borderRadius: 12, overflow: "hidden", background: COLOR.tarjeta }}>
      <button
        onClick={onToggle}
        style={{
          width: "100%",
          display: "flex",
          alignItems: "center",
          gap: 12,
          padding: "14px 16px",
          background: abierta ? COLOR.grafito : COLOR.tarjeta,
          color: abierta ? COLOR.fondo : COLOR.grafito,
          border: "none",
          cursor: "pointer",
          textAlign: "left",
        }}
      >
        <span style={{ fontSize: 22 }}>{categoria.icono}</span>
        <span style={{ fontFamily: F_DISPLAY, fontSize: 16, fontWeight: 900, flex: 1 }}>{categoria.nombre[idioma]}</span>
        <span style={{ fontSize: 12, color: abierta ? COLOR.amarillo : COLOR.grafitoSuave, fontWeight: 700 }}>
          {productos.length > 0 ? `${productos.length}` : ""}
        </span>
        <span style={{ fontSize: 16, transform: abierta ? "rotate(180deg)" : "none", transition: "transform 0.15s" }}>▾</span>
      </button>

      {abierta && categoria.id === "pinturas" && (
        <div style={{ padding: "12px 14px 16px" }}>
          <PinturaAsistente onAgregarExtra={onAgregarExtra} idioma={idioma} />
        </div>
      )}

      {abierta && categoria.id === "fijacion-tornillos" && (
        <div style={{ padding: "12px 14px 16px" }}>
          <TornilleriaAsistente onAgregarExtra={onAgregarExtra} idioma={idioma} />
        </div>
      )}

      {abierta && categoria.id === "yeso-cartonyeso" && (
        <div style={{ padding: "12px 14px 16px" }}>
          <YesoCartonYesoAsistente
            onAgregarExtra={onAgregarExtra}
            idioma={idioma}
            t={t}
            productosDisponibles={productosDisponibles}
            listaCotizacion={listaCotizacion}
            onAgregar={onAgregar}
            onCambiar={onCambiar}
          />
        </div>
      )}

      {abierta && categoria.id === "agencement" && (
        <div style={{ padding: "12px 14px 16px" }}>
          <CarpinteriaAsistente
            onAgregarExtra={onAgregarExtra}
            idioma={idioma}
            t={t}
            productosDisponibles={productosDisponibles}
            listaCotizacion={listaCotizacion}
            onAgregar={onAgregar}
            onCambiar={onCambiar}
          />
        </div>
      )}

      {abierta && categoria.id === "electricidad" && (
        <div style={{ padding: "12px 14px 16px" }}>
          <AsistenteGenerico config={CONFIG_ELECTRICIDAD} onAgregarExtra={onAgregarExtra} />
        </div>
      )}

      {abierta && categoria.id === "fontaneria" && (
        <div style={{ padding: "12px 14px 16px" }}>
          <AsistenteGenerico config={CONFIG_FONTANERIA} onAgregarExtra={onAgregarExtra} />
        </div>
      )}

      {abierta && categoria.id === "herramientas" && (
        <div style={{ padding: "12px 14px 16px" }}>
          <AsistenteGenerico config={CONFIG_HERRAMIENTAS} onAgregarExtra={onAgregarExtra} />
        </div>
      )}

      {abierta && categoria.id === "seguridad" && (
        <div style={{ padding: "12px 14px 16px" }}>
          <AsistenteGenerico config={CONFIG_SEGURIDAD} onAgregarExtra={onAgregarExtra} />
        </div>
      )}

      {abierta && categoria.id === "maquinaria" && (
        <div style={{ padding: "12px 14px 16px" }}>
          <AsistenteGenerico config={CONFIG_MAQUINARIA} onAgregarExtra={onAgregarExtra} />
        </div>
      )}

      {abierta && categoria.id === "energia-solar" && (
        <div style={{ padding: "12px 14px 16px" }}>
          <AsistenteGenerico config={CONFIG_ENERGIA_SOLAR} onAgregarExtra={onAgregarExtra} />
        </div>
      )}

      {abierta && categoria.id === "consumibles" && (
        <div style={{ padding: "12px 14px 16px" }}>
          <AsistenteGenerico config={CONFIG_CONSUMIBLES} onAgregarExtra={onAgregarExtra} />
        </div>
      )}

      {abierta && categoria.id === "ferreteria-general" && (
        <div style={{ padding: "12px 14px 16px" }}>
          <AsistenteGenerico config={CONFIG_FERRETERIA_GENERAL} onAgregarExtra={onAgregarExtra} />
        </div>
      )}

      {abierta && categoria.id === "calefaccion-climatizacion" && (
        <div style={{ padding: "12px 14px 16px" }}>
          <AsistenteGenerico config={CONFIG_CALEFACCION} onAgregarExtra={onAgregarExtra} />
        </div>
      )}

      {abierta &&
        categoria.id !== "pinturas" &&
        categoria.id !== "fijacion-tornillos" &&
        categoria.id !== "yeso-cartonyeso" &&
        categoria.id !== "agencement" &&
        categoria.id !== "electricidad" &&
        categoria.id !== "fontaneria" &&
        categoria.id !== "herramientas" &&
        categoria.id !== "seguridad" &&
        categoria.id !== "maquinaria" &&
        categoria.id !== "energia-solar" &&
        categoria.id !== "consumibles" &&
        categoria.id !== "ferreteria-general" &&
        categoria.id !== "calefaccion-climatizacion" && (
        <div style={{ padding: "12px 14px 16px" }}>
          <div style={{ display: "flex", gap: 6, overflowX: "auto", paddingBottom: 10 }}>
            {subsMostrados.map((s, i) => (
              <SubPill key={s} activo={subActiva === subsInternos[i]} onClick={() => onElegirSub(subsInternos[i])}>
                {s}
              </SubPill>
            ))}
          </div>
          {categoria.id === "puertas-ventanas" && subActiva === "Ventanas" ? (
            <VentanasAsistente
              onAgregarExtra={onAgregarExtra}
              idioma={idioma}
              t={t}
              productosDisponibles={productosDisponibles}
              listaCotizacion={listaCotizacion}
              onAgregar={onAgregar}
              onCambiar={onCambiar}
            />
          ) : categoria.id === "puertas-ventanas" && subActiva === "Puertas" ? (
            <PuertasAsistente
              onAgregarExtra={onAgregarExtra}
              idioma={idioma}
              t={t}
              productosDisponibles={productosDisponibles}
              listaCotizacion={listaCotizacion}
              onAgregar={onAgregar}
              onCambiar={onCambiar}
            />
          ) : (
            <div style={{ display: "grid", gridTemplateColumns: "repeat(auto-fill, minmax(150px, 1fr))", gap: 10 }}>
              {productos.map((p) => (
                <ProductoCard
                  key={p.id}
                  producto={p}
                  t={t}
                  idioma={idioma}
                  onAgregar={() => onAgregar(p.id)}
                  cantidad={listaCotizacion[p.id] || 0}
                  onCambiar={(delta) => onCambiar(p.id, delta)}
                />
              ))}
            </div>
          )}
        </div>
      )}
    </div>
  );
}

function SubPill({ children, activo, onClick }) {
  return (
    <button
      onClick={onClick}
      style={{
        flexShrink: 0,
        padding: "6px 12px",
        borderRadius: 999,
        border: `1px solid ${activo ? COLOR.ladrillo : COLOR.borde}`,
        background: activo ? COLOR.ladrillo : "transparent",
        color: activo ? "#fff" : COLOR.grafitoSuave,
        fontSize: 12,
        fontWeight: 700,
        cursor: "pointer",
        whiteSpace: "nowrap",
      }}
    >
      {children}
    </button>
  );
}


// ---------- Asistente de pintura: Tipo → Color → Cantidad → Marca/Nivel ----------
const MATERIALES_ESPECIALES = ["Acero", "Metal", "Maquinaria", "Madera"];
const NIVELES_PINTURA = ["Económico", "Primer precio", "Profesional"];

// ---------- Asistente de Fijación/Tornillería: Categoría → Tipo → Material → Medida → Cantidad ----------
// Esquema basado en cómo organiza sus tornillos Rationalstock.es, una ferretería
// industrial de referencia en España (tipo de cabeza/rosca, material, medida).
const TIPOS_POR_CATEGORIA_FIJACION = {
  "Tornillos": ["Hexagonal rosca métrica", "Cilíndrica (Allen)", "Avellanado", "Rosca chapa", "Rosca madera", "Carpintería aluminio/PVC", "Varilla roscada", "Espárragos", "Palomilla", "Otro"],
  "Tuercas": ["Hexagonal", "Autoblocante", "Mariposa", "Ciega", "Otro"],
  "Arandelas": ["Plana", "Presión (grower)", "Dentada", "Otro"],
  "Pernos": ["Hexagonal", "Carruaje", "Anclaje", "Otro"],
};
const MATERIALES_FIJACION = ["Acero", "Acero cincado", "Inox A2", "Inox A4", "Poliamida"];
const TIENE_LONGITUD = { "Tornillos": true, "Pernos": true, "Tuercas": false, "Arandelas": false };

function TornilleriaAsistente({ onAgregarExtra, idioma }) {
  const [paso, setPaso] = React.useState(0);
  const [categoria, setCategoria] = React.useState(null); // Tornillos | Tuercas | Arandelas | Pernos | Otro
  const [categoriaOtroTexto, setCategoriaOtroTexto] = React.useState("");
  const [tipo, setTipo] = React.useState(null);
  const [tipoOtroTexto, setTipoOtroTexto] = React.useState("");
  const [material, setMaterial] = React.useState(null);
  const [materialOtroTexto, setMaterialOtroTexto] = React.useState("");
  const [diametro, setDiametro] = React.useState("");
  const [longitud, setLongitud] = React.useState("");
  const [cantidad, setCantidad] = React.useState("");
  const [agregado, setAgregado] = React.useState(false);

  const nombresPasos = ["Categoría", "Tipo", "Material", "Medida", "Cantidad"];
  const necesitaLongitud = categoria ? (TIENE_LONGITUD[categoria] ?? true) : true;
  const tiposDisponibles = categoria ? (TIPOS_POR_CATEGORIA_FIJACION[categoria] || ["Otro"]) : [];
  const categoriaFinal = categoria === "Otro" ? categoriaOtroTexto.trim() : categoria;
  const materialFinal = material === "Otro" ? materialOtroTexto.trim() : material;

  function reiniciar() {
    setPaso(0);
    setCategoria(null);
    setCategoriaOtroTexto("");
    setTipo(null);
    setTipoOtroTexto("");
    setMaterial(null);
    setMaterialOtroTexto("");
    setDiametro("");
    setLongitud("");
    setCantidad("");
  }

  function puedeAvanzarDesde(p) {
    if (p === 0) return categoria === "Otro" ? categoriaOtroTexto.trim() !== "" : !!categoria;
    if (p === 1) return tipo === "Otro" ? tipoOtroTexto.trim() !== "" : !!tipo;
    if (p === 2) return material === "Otro" ? materialOtroTexto.trim() !== "" : !!material;
    if (p === 3) return diametro.trim() !== "" && (!necesitaLongitud || longitud.trim() !== "");
    if (p === 4) return cantidad !== "" && Number(cantidad) > 0;
    return false;
  }

  function agregarSeleccion() {
    const tipoTexto = tipo === "Otro" ? tipoOtroTexto.trim() : tipo;
    const medidaTexto = necesitaLongitud ? `${diametro}x${longitud}mm` : `Ø${diametro}mm`;
    const texto = `${categoriaFinal} — ${tipoTexto} — ${materialFinal} — ${medidaTexto} — ${cantidad} uds`;
    onAgregarExtra(texto);
    setAgregado(true);
    setTimeout(() => {
      setAgregado(false);
      reiniciar();
    }, 1800);
  }

  if (agregado) {
    return (
      <div style={{ textAlign: "center", padding: "30px 10px" }}>
        <div style={{ fontSize: 34, marginBottom: 6 }}>✓</div>
        <div style={{ fontWeight: 800, fontSize: 14 }}>Agregado a tu cotización</div>
      </div>
    );
  }

  return (
    <div>
      <div style={{ display: "flex", alignItems: "center", gap: 4, marginBottom: 16 }}>
        {nombresPasos.map((nombre, i) => (
          <React.Fragment key={nombre}>
            <div style={{ display: "flex", flexDirection: "column", alignItems: "center", flex: 1 }}>
              <div
                style={{
                  width: 22,
                  height: 22,
                  borderRadius: "50%",
                  display: "flex",
                  alignItems: "center",
                  justifyContent: "center",
                  fontSize: 10.5,
                  fontWeight: 800,
                  background: i <= paso ? COLOR.amarillo : COLOR.borde,
                  color: i <= paso ? COLOR.grafito : COLOR.grafitoSuave,
                }}
              >
                {i + 1}
              </div>
              <div style={{ fontSize: 8.5, color: i === paso ? COLOR.grafito : COLOR.grafitoSuave, fontWeight: i === paso ? 800 : 400, marginTop: 2, textAlign: "center" }}>
                {nombre}
              </div>
            </div>
            {i < nombresPasos.length - 1 && <div style={{ flex: 1, height: 2, background: i < paso ? COLOR.amarillo : COLOR.borde, marginBottom: 12 }} />}
          </React.Fragment>
        ))}
      </div>

      {/* Paso 1: Categoría */}
      {paso === 0 && (
        <div>
          <FieldLabel>¿Qué necesitás?</FieldLabel>
          <div style={{ display: "flex", flexDirection: "column", gap: 6, marginBottom: 8 }}>
            {Object.keys(TIPOS_POR_CATEGORIA_FIJACION).map((c) => (
              <OpcionRadio key={c} seleccionado={categoria === c} onClick={() => { setCategoria(c); setTipo(null); }}>
                {c}
              </OpcionRadio>
            ))}
            <OpcionRadio seleccionado={categoria === "Otro"} onClick={() => { setCategoria("Otro"); setTipo(null); }}>
              Otro (escribir)
            </OpcionRadio>
          </div>
          {categoria === "Otro" && (
            <input
              value={categoriaOtroTexto}
              onChange={(e) => setCategoriaOtroTexto(e.target.value)}
              placeholder="Ej: remaches, tacos, grapas..."
              style={{ width: "100%", padding: "9px 10px", border: `1px solid ${COLOR.borde}`, borderRadius: 8, fontSize: 13.5, boxSizing: "border-box" }}
              autoFocus
            />
          )}
        </div>
      )}

      {/* Paso 2: Tipo */}
      {paso === 1 && categoria && (
        <div>
          <FieldLabel>Tipo de {(categoriaFinal || categoria).toLowerCase()}</FieldLabel>
          <div style={{ display: "flex", flexDirection: "column", gap: 6, marginBottom: 10 }}>
            {tiposDisponibles.map((tp) => (
              <OpcionRadio key={tp} seleccionado={tipo === tp} onClick={() => setTipo(tp)}>
                {tp}
              </OpcionRadio>
            ))}
          </div>
          {tipo === "Otro" && (
            <input
              value={tipoOtroTexto}
              onChange={(e) => setTipoOtroTexto(e.target.value)}
              placeholder="Describí el tipo que necesitás"
              style={{ width: "100%", padding: "9px 10px", border: `1px solid ${COLOR.borde}`, borderRadius: 8, fontSize: 13.5, boxSizing: "border-box" }}
              autoFocus
            />
          )}
        </div>
      )}

      {/* Paso 3: Material */}
      {paso === 2 && (
        <div>
          <FieldLabel>Material</FieldLabel>
          <div style={{ display: "flex", flexDirection: "column", gap: 6, marginBottom: 8 }}>
            {MATERIALES_FIJACION.map((m) => (
              <OpcionRadio key={m} seleccionado={material === m} onClick={() => setMaterial(m)}>
                {m}
              </OpcionRadio>
            ))}
            <OpcionRadio seleccionado={material === "Otro"} onClick={() => setMaterial("Otro")}>
              Otro (escribir)
            </OpcionRadio>
          </div>
          {material === "Otro" && (
            <input
              value={materialOtroTexto}
              onChange={(e) => setMaterialOtroTexto(e.target.value)}
              placeholder="Ej: latón, bronce..."
              style={{ width: "100%", padding: "9px 10px", border: `1px solid ${COLOR.borde}`, borderRadius: 8, fontSize: 13.5, boxSizing: "border-box" }}
              autoFocus
            />
          )}
        </div>
      )}

      {/* Paso 4: Medida */}
      {paso === 3 && (
        <div>
          <FieldLabel>{necesitaLongitud ? "Diámetro y longitud (mm)" : "Diámetro (mm)"}</FieldLabel>
          <div style={{ display: "flex", gap: 8 }}>
            <input
              value={diametro}
              onChange={(e) => setDiametro(e.target.value)}
              placeholder="Ej: 8"
              style={{ flex: 1, padding: "9px 10px", border: `1px solid ${COLOR.borde}`, borderRadius: 8, fontSize: 13.5, boxSizing: "border-box" }}
            />
            {necesitaLongitud && (
              <>
                <div style={{ display: "flex", alignItems: "center", color: COLOR.grafitoSuave }}>×</div>
                <input
                  value={longitud}
                  onChange={(e) => setLongitud(e.target.value)}
                  placeholder="Ej: 30"
                  style={{ flex: 1, padding: "9px 10px", border: `1px solid ${COLOR.borde}`, borderRadius: 8, fontSize: 13.5, boxSizing: "border-box" }}
                />
              </>
            )}
          </div>
          <div style={{ fontSize: 10.5, color: COLOR.grafitoSuave, marginTop: 6 }}>
            {necesitaLongitud ? "Ej: M8 x 30mm — diámetro de rosca × longitud del vástago." : "Ej: M8 — diámetro de paso de rosca."}
          </div>
        </div>
      )}

      {/* Paso 5: Cantidad */}
      {paso === 4 && (
        <div>
          <FieldLabel>¿Cuántas unidades necesitás?</FieldLabel>
          <input
            type="number"
            min="0"
            value={cantidad}
            onChange={(e) => setCantidad(e.target.value)}
            placeholder="Ej: 100"
            style={{ width: "100%", padding: "9px 10px", border: `1px solid ${COLOR.borde}`, borderRadius: 8, fontSize: 13.5, boxSizing: "border-box", marginBottom: 10 }}
          />
          <div style={{ background: COLOR.fondo, border: `1px solid ${COLOR.borde}`, borderRadius: 8, padding: 10, fontSize: 12, color: COLOR.grafitoSuave, lineHeight: 1.4 }}>
            <strong>Resumen:</strong> {categoriaFinal} · {tipo === "Otro" ? tipoOtroTexto : tipo} · {materialFinal} · {necesitaLongitud ? `${diametro || "—"}x${longitud || "—"}mm` : `Ø${diametro || "—"}mm`}
          </div>
        </div>
      )}

      {/* Navegación */}
      <div style={{ display: "flex", gap: 8, marginTop: 16 }}>
        {paso > 0 && (
          <button
            onClick={() => setPaso(paso - 1)}
            style={{ flex: "0 0 auto", padding: "10px 14px", background: "transparent", border: `1px solid ${COLOR.borde}`, borderRadius: 8, fontWeight: 700, fontSize: 13, cursor: "pointer" }}
          >
            Atrás
          </button>
        )}
        {paso < 4 ? (
          <button
            onClick={() => puedeAvanzarDesde(paso) && setPaso(paso + 1)}
            disabled={!puedeAvanzarDesde(paso)}
            style={{
              flex: 1,
              padding: "10px 14px",
              background: puedeAvanzarDesde(paso) ? COLOR.amarillo : COLOR.borde,
              border: "none",
              borderRadius: 8,
              fontWeight: 800,
              fontSize: 13,
              cursor: puedeAvanzarDesde(paso) ? "pointer" : "default",
              color: COLOR.grafito,
            }}
          >
            Siguiente
          </button>
        ) : (
          <button
            onClick={() => puedeAvanzarDesde(4) && agregarSeleccion()}
            disabled={!puedeAvanzarDesde(4)}
            style={{
              flex: 1,
              padding: "10px 14px",
              background: puedeAvanzarDesde(4) ? "#2E7D32" : COLOR.borde,
              border: "none",
              borderRadius: 8,
              fontWeight: 800,
              fontSize: 13,
              cursor: puedeAvanzarDesde(4) ? "pointer" : "default",
              color: "#fff",
            }}
          >
            Agregar a mi cotización
          </button>
        )}
      </div>
    </div>
  );
}

function AsistenteGenerico({ config, onAgregarExtra }) {
  const tiposNombres = Object.keys(config.tipos);
  const [tipo, setTipo] = React.useState(null);
  const [tipoOtroTexto, setTipoOtroTexto] = React.useState("");
  const [valores, setValores] = React.useState({});
  const [valoresOtro, setValoresOtro] = React.useState({});
  const [cantidad, setCantidad] = React.useState("");
  const [paso, setPaso] = React.useState(0);
  const [agregado, setAgregado] = React.useState(false);

  const campos = tipo && tipo !== "Otro" ? config.tipos[tipo].campos : [];
  const nombresPasos = ["Tipo", ...campos.map((c) => c.label), "Cantidad"];
  const totalPasos = nombresPasos.length;

  function reiniciar() {
    setPaso(0); setTipo(null); setTipoOtroTexto(""); setValores({}); setValoresOtro({}); setCantidad("");
  }

  function puedeAvanzarDesde(p) {
    if (p === 0) return tipo === "Otro" ? tipoOtroTexto.trim() !== "" : !!tipo;
    if (p > 0 && p <= campos.length) {
      const campo = campos[p - 1];
      const val = valores[campo.campo];
      return val === "Otro" ? (valoresOtro[campo.campo] || "").trim() !== "" : !!val;
    }
    if (p === totalPasos - 1) return cantidad !== "" && Number(cantidad) > 0;
    return false;
  }

  function agregarSeleccion() {
    const tipoFinal = tipo === "Otro" ? tipoOtroTexto.trim() : tipo;
    const partesCampos = campos.map((c) => {
      const v = valores[c.campo];
      return v === "Otro" ? (valoresOtro[c.campo] || "").trim() : v;
    });
    const texto = `${config.titulo} — ${tipoFinal}${partesCampos.length ? " — " + partesCampos.join(" — ") : ""} — ${cantidad} uds`;
    onAgregarExtra(texto);
    setAgregado(true);
    setTimeout(() => { setAgregado(false); reiniciar(); }, 1800);
  }

  if (agregado) {
    return (
      <div style={{ textAlign: "center", padding: "30px 10px" }}>
        <div style={{ fontSize: 34, marginBottom: 6 }}>✓</div>
        <div style={{ fontWeight: 800, fontSize: 14 }}>Agregado a tu cotización</div>
      </div>
    );
  }

  return (
    <div>
      <div style={{ display: "flex", alignItems: "center", gap: 3, marginBottom: 16, overflowX: "auto" }}>
        {nombresPasos.map((nombre, i) => (
          <React.Fragment key={nombre + i}>
            <div style={{ display: "flex", flexDirection: "column", alignItems: "center", flex: "0 0 auto", minWidth: 50 }}>
              <div style={{ width: 20, height: 20, borderRadius: "50%", display: "flex", alignItems: "center", justifyContent: "center", fontSize: 10, fontWeight: 800, background: i <= paso ? COLOR.amarillo : COLOR.borde, color: i <= paso ? COLOR.grafito : COLOR.grafitoSuave }}>
                {i + 1}
              </div>
              <div style={{ fontSize: 8, color: i === paso ? COLOR.grafito : COLOR.grafitoSuave, fontWeight: i === paso ? 800 : 400, marginTop: 2, textAlign: "center" }}>{nombre}</div>
            </div>
            {i < nombresPasos.length - 1 && <div style={{ flex: "1 1 12px", height: 2, background: i < paso ? COLOR.amarillo : COLOR.borde, marginBottom: 12 }} />}
          </React.Fragment>
        ))}
      </div>

      {/* Paso 0: Tipo */}
      {paso === 0 && (
        <div>
          <FieldLabel>¿Qué necesitás?</FieldLabel>
          <div style={{ display: "flex", flexDirection: "column", gap: 6, marginBottom: 8 }}>
            {tiposNombres.map((tp) => (
              <OpcionRadio key={tp} seleccionado={tipo === tp} onClick={() => { setTipo(tp); setValores({}); setValoresOtro({}); }}>
                {tp}
              </OpcionRadio>
            ))}
            <OpcionRadio seleccionado={tipo === "Otro"} onClick={() => { setTipo("Otro"); setValores({}); setValoresOtro({}); }}>
              Otro (escribir)
            </OpcionRadio>
          </div>
          {tipo === "Otro" && (
            <input
              value={tipoOtroTexto}
              onChange={(e) => setTipoOtroTexto(e.target.value)}
              placeholder="Describí lo que necesitás"
              style={{ width: "100%", padding: "9px 10px", border: `1px solid ${COLOR.borde}`, borderRadius: 8, fontSize: 13.5, boxSizing: "border-box" }}
              autoFocus
            />
          )}
        </div>
      )}

      {/* Pasos intermedios: uno por cada campo del tipo elegido */}
      {campos.map((c, i) => paso === i + 1 && (
        <div key={c.campo}>
          <FieldLabel>{c.label}</FieldLabel>
          <div style={{ display: "flex", gap: 6, flexWrap: "wrap", marginBottom: 8 }}>
            {c.opciones.map((op) => (
              <SubPill key={op} activo={valores[c.campo] === op} onClick={() => setValores({ ...valores, [c.campo]: op })}>
                {op}
              </SubPill>
            ))}
            <SubPill activo={valores[c.campo] === "Otro"} onClick={() => setValores({ ...valores, [c.campo]: "Otro" })}>
              Otro
            </SubPill>
          </div>
          {valores[c.campo] === "Otro" && (
            <input
              value={valoresOtro[c.campo] || ""}
              onChange={(e) => setValoresOtro({ ...valoresOtro, [c.campo]: e.target.value })}
              placeholder="Especificá"
              style={{ width: "100%", padding: "9px 10px", border: `1px solid ${COLOR.borde}`, borderRadius: 8, fontSize: 13.5, boxSizing: "border-box" }}
              autoFocus
            />
          )}
        </div>
      ))}

      {/* Último paso: cantidad + resumen */}
      {paso === totalPasos - 1 && (
        <div>
          <FieldLabel>¿Cuántas unidades necesitás?</FieldLabel>
          <input
            type="number"
            min="0"
            value={cantidad}
            onChange={(e) => setCantidad(e.target.value)}
            placeholder="Ej: 10"
            style={{ width: "100%", padding: "9px 10px", border: `1px solid ${COLOR.borde}`, borderRadius: 8, fontSize: 13.5, boxSizing: "border-box", marginBottom: 10 }}
          />
          <div style={{ background: COLOR.fondo, border: `1px solid ${COLOR.borde}`, borderRadius: 8, padding: 10, fontSize: 11.5, color: COLOR.grafitoSuave, lineHeight: 1.5 }}>
            <strong>Resumen:</strong> {tipo === "Otro" ? tipoOtroTexto : tipo}
            {campos.map((c) => {
              const v = valores[c.campo] === "Otro" ? valoresOtro[c.campo] : valores[c.campo];
              return v ? ` · ${v}` : "";
            }).join("")}
          </div>
        </div>
      )}

      <div style={{ display: "flex", gap: 8, marginTop: 16 }}>
        {paso > 0 && (
          <button onClick={() => setPaso(paso - 1)} style={{ flex: "0 0 auto", padding: "10px 14px", background: "transparent", border: `1px solid ${COLOR.borde}`, borderRadius: 8, fontWeight: 700, fontSize: 13, cursor: "pointer" }}>
            Atrás
          </button>
        )}
        {paso < totalPasos - 1 ? (
          <button
            onClick={() => puedeAvanzarDesde(paso) && setPaso(paso + 1)}
            disabled={!puedeAvanzarDesde(paso)}
            style={{ flex: 1, padding: "10px 14px", background: puedeAvanzarDesde(paso) ? COLOR.amarillo : COLOR.borde, border: "none", borderRadius: 8, fontWeight: 800, fontSize: 13, cursor: puedeAvanzarDesde(paso) ? "pointer" : "default", color: COLOR.grafito }}
          >
            Siguiente
          </button>
        ) : (
          <button
            onClick={() => puedeAvanzarDesde(paso) && agregarSeleccion()}
            disabled={!puedeAvanzarDesde(paso)}
            style={{ flex: 1, padding: "10px 14px", background: puedeAvanzarDesde(paso) ? "#2E7D32" : COLOR.borde, border: "none", borderRadius: 8, fontWeight: 800, fontSize: 13, cursor: puedeAvanzarDesde(paso) ? "pointer" : "default", color: "#fff" }}
          >
            Agregar a mi cotización
          </button>
        )}
      </div>
    </div>
  );
}

  const [agregado, setAgregado] = React.useState(false);

  const esTablero = tipo === "MDF crudo" || tipo === "Aglomerado / Melamina";
  const esRedonda = tipo === "Madera de soporte redonda";
  const esCuadrada = tipo === "Madera de soporte cuadrada";

  const nombresPasos = esTablero
    ? (tipo === "Aglomerado / Melamina" ? ["Tipo", "Color", "Espesor y tamaño", "Cantidad"] : ["Tipo", "Espesor y tamaño", "Cantidad"])
    : ["Tipo", "Medida", "Cantidad"];
  const totalPasos = nombresPasos.length;

  if (tipo === "Molduras y Bisagras") {
    const productos = productosDisponibles.filter((p) => p.cat === "agencement" && p.sub === "Molduras y Bisagras");
    return (
      <div>
        <button onClick={() => setTipo(null)} style={{ background: "none", border: "none", color: COLOR.grafitoSuave, fontSize: 12, fontWeight: 700, cursor: "pointer", padding: 0, marginBottom: 12 }}>
          ← Material
        </button>
        <div style={{ fontWeight: 800, fontSize: 14, marginBottom: 10 }}>Molduras y Bisagras</div>
        <div style={{ display: "grid", gridTemplateColumns: "repeat(auto-fill, minmax(150px, 1fr))", gap: 10 }}>
          {productos.map((p) => (
            <ProductoCard
              key={p.id}
              producto={p}
              t={t}
              idioma={idioma}
              onAgregar={() => onAgregar(p.id)}
              cantidad={listaCotizacion[p.id] || 0}
              onCambiar={(delta) => onCambiar(p.id, delta)}
            />
          ))}
        </div>
      </div>
    );
  }

  function reiniciar() {
    setPaso(0); setTipo(null); setEspesor(null); setTamano(null); setColor(null); setDiametro(null); setLargo(null); setSeccion(null); setCantidad("");
  }

  // Mapea el paso visual (según el tipo elegido) a la lógica interna
  function puedeAvanzarDesde(p) {
    if (p === 0) return !!tipo;
    if (esTablero && tipo === "Aglomerado / Melamina") {
      if (p === 1) return !!color;
      if (p === 2) return !!espesor && !!tamano;
      if (p === 3) return cantidad !== "" && Number(cantidad) > 0;
    } else if (esTablero) {
      if (p === 1) return !!espesor && !!tamano;
      if (p === 2) return cantidad !== "" && Number(cantidad) > 0;
    } else if (esRedonda) {
      if (p === 1) return !!diametro && !!largo;
      if (p === 2) return cantidad !== "" && Number(cantidad) > 0;
    } else if (esCuadrada) {
      if (p === 1) return !!seccion && !!largo;
      if (p === 2) return cantidad !== "" && Number(cantidad) > 0;
    }
    return false;
  }

  function agregarSeleccion() {
    let texto = "";
    if (tipo === "Aglomerado / Melamina") {
      texto = `Tablero aglomerado/melamina — ${color} — ${espesor} — ${tamano} — ${cantidad} planchas`;
    } else if (tipo === "MDF crudo") {
      texto = `Tablero MDF crudo — ${espesor} — ${tamano} — ${cantidad} planchas`;
    } else if (esRedonda) {
      texto = `Madera de soporte redonda (varilla) — Ø${diametro} — ${largo} — ${cantidad} unidades`;
    } else {
      texto = `Madera de soporte cuadrada (poste) — ${seccion} — ${largo} — ${cantidad} unidades`;
    }
    onAgregarExtra(texto);
    setAgregado(true);
    setTimeout(() => { setAgregado(false); reiniciar(); }, 1800);
  }

  if (agregado) {
    return (
      <div style={{ textAlign: "center", padding: "30px 10px" }}>
        <div style={{ fontSize: 34, marginBottom: 6 }}>✓</div>
        <div style={{ fontWeight: 800, fontSize: 14 }}>Agregado a tu cotización</div>
      </div>
    );
  }

  return (
    <div>
      <div style={{ display: "flex", alignItems: "center", gap: 3, marginBottom: 16, overflowX: "auto" }}>
        {nombresPasos.map((nombre, i) => (
          <React.Fragment key={nombre}>
            <div style={{ display: "flex", flexDirection: "column", alignItems: "center", flex: "0 0 auto", minWidth: 50 }}>
              <div style={{ width: 20, height: 20, borderRadius: "50%", display: "flex", alignItems: "center", justifyContent: "center", fontSize: 10, fontWeight: 800, background: i <= paso ? COLOR.amarillo : COLOR.borde, color: i <= paso ? COLOR.grafito : COLOR.grafitoSuave }}>
                {i + 1}
              </div>
              <div style={{ fontSize: 8, color: i === paso ? COLOR.grafito : COLOR.grafitoSuave, fontWeight: i === paso ? 800 : 400, marginTop: 2, textAlign: "center" }}>{nombre}</div>
            </div>
            {i < nombresPasos.length - 1 && <div style={{ flex: "1 1 12px", height: 2, background: i < paso ? COLOR.amarillo : COLOR.borde, marginBottom: 12 }} />}
          </React.Fragment>
        ))}
      </div>

      {paso === 0 && (
        <div>
          <FieldLabel>¿Qué material necesitás?</FieldLabel>
          <div style={{ display: "flex", flexDirection: "column", gap: 6 }}>
            {TIPOS_MATERIAL_CARPINTERIA.map((tp) => (
              <OpcionRadio key={tp} seleccionado={tipo === tp} onClick={() => { setTipo(tp); setEspesor(null); setTamano(null); setColor(null); setDiametro(null); setLargo(null); setSeccion(null); }}>
                {tp}
              </OpcionRadio>
            ))}
            <OpcionRadio seleccionado={false} onClick={() => setTipo("Molduras y Bisagras")}>
              Molduras y Bisagras
            </OpcionRadio>
          </div>
        </div>
      )}

      {/* Aglomerado: paso 1 = color */}
      {paso === 1 && tipo === "Aglomerado / Melamina" && (
        <div>
          <FieldLabel>Color / acabado</FieldLabel>
          <div style={{ display: "flex", gap: 6, flexWrap: "wrap" }}>
            {COLORES_AGLOMERADO.map((c) => (
              <SubPill key={c} activo={color === c} onClick={() => setColor(c)}>{c}</SubPill>
            ))}
          </div>
        </div>
      )}

      {/* Tableros (MDF o Aglomerado): espesor + tamaño */}
      {((paso === 1 && tipo === "MDF crudo") || (paso === 2 && tipo === "Aglomerado / Melamina")) && (
        <div>
          <FieldLabel>Espesor</FieldLabel>
          <div style={{ display: "flex", gap: 6, flexWrap: "wrap", marginBottom: 12 }}>
            {ESPESORES_TABLERO.map((e) => (
              <SubPill key={e} activo={espesor === e} onClick={() => setEspesor(e)}>{e}</SubPill>
            ))}
          </div>
          <FieldLabel>Tamaño del tablero</FieldLabel>
          <div style={{ display: "flex", gap: 6, flexWrap: "wrap" }}>
            {TAMANOS_TABLERO.map((t) => (
              <SubPill key={t} activo={tamano === t} onClick={() => setTamano(t)}>{t}</SubPill>
            ))}
          </div>
        </div>
      )}

      {/* Madera redonda: diámetro + largo */}
      {paso === 1 && esRedonda && (
        <div>
          <FieldLabel>Diámetro</FieldLabel>
          <div style={{ display: "flex", gap: 6, flexWrap: "wrap", marginBottom: 12 }}>
            {DIAMETROS_VARILLA.map((d) => (
              <SubPill key={d} activo={diametro === d} onClick={() => setDiametro(d)}>{d}</SubPill>
            ))}
          </div>
          <FieldLabel>Largo</FieldLabel>
          <div style={{ display: "flex", gap: 6, flexWrap: "wrap" }}>
            {LARGOS_VARILLA.map((l) => (
              <SubPill key={l} activo={largo === l} onClick={() => setLargo(l)}>{l}</SubPill>
            ))}
          </div>
        </div>
      )}

      {/* Madera cuadrada: sección + largo */}
      {paso === 1 && esCuadrada && (
        <div>
          <FieldLabel>Sección</FieldLabel>
          <div style={{ display: "flex", gap: 6, flexWrap: "wrap", marginBottom: 12 }}>
            {SECCIONES_POSTE.map((s) => (
              <SubPill key={s} activo={seccion === s} onClick={() => setSeccion(s)}>{s}</SubPill>
            ))}
          </div>
          <FieldLabel>Largo</FieldLabel>
          <div style={{ display: "flex", gap: 6, flexWrap: "wrap" }}>
            {LARGOS_POSTE.map((l) => (
              <SubPill key={l} activo={largo === l} onClick={() => setLargo(l)}>{l}</SubPill>
            ))}
          </div>
        </div>
      )}

      {/* Último paso: cantidad + resumen */}
      {paso === totalPasos - 1 && (
        <div>
          <FieldLabel>¿Cuántas unidades necesitás?</FieldLabel>
          <input type="number" min="0" value={cantidad} onChange={(e) => setCantidad(e.target.value)} placeholder="Ej: 5"
            style={{ width: "100%", padding: "9px 10px", border: `1px solid ${COLOR.borde}`, borderRadius: 8, fontSize: 13.5, boxSizing: "border-box", marginBottom: 10 }} />
          <div style={{ background: COLOR.fondo, border: `1px solid ${COLOR.borde}`, borderRadius: 8, padding: 10, fontSize: 11.5, color: COLOR.grafitoSuave, lineHeight: 1.5 }}>
            <strong>Resumen:</strong>{" "}
            {tipo === "Aglomerado / Melamina" && `${color} · ${espesor} · ${tamano}`}
            {tipo === "MDF crudo" && `${espesor} · ${tamano}`}
            {esRedonda && `Ø${diametro} · ${largo}`}
            {esCuadrada && `${seccion} · ${largo}`}
          </div>
        </div>
      )}

      <div style={{ display: "flex", gap: 8, marginTop: 16 }}>
        {paso > 0 && (
          <button onClick={() => setPaso(paso - 1)} style={{ flex: "0 0 auto", padding: "10px 14px", background: "transparent", border: `1px solid ${COLOR.borde}`, borderRadius: 8, fontWeight: 700, fontSize: 13, cursor: "pointer" }}>
            Atrás
          </button>
        )}
        {paso < totalPasos - 1 ? (
          <button onClick={() => puedeAvanzarDesde(paso) && setPaso(paso + 1)} disabled={!puedeAvanzarDesde(paso)}
            style={{ flex: 1, padding: "10px 14px", background: puedeAvanzarDesde(paso) ? COLOR.amarillo : COLOR.borde, border: "none", borderRadius: 8, fontWeight: 800, fontSize: 13, cursor: puedeAvanzarDesde(paso) ? "pointer" : "default", color: COLOR.grafito }}>
            Siguiente
          </button>
        ) : (
          <button onClick={() => puedeAvanzarDesde(paso) && agregarSeleccion()} disabled={!puedeAvanzarDesde(paso)}
            style={{ flex: 1, padding: "10px 14px", background: puedeAvanzarDesde(paso) ? "#2E7D32" : COLOR.borde, border: "none", borderRadius: 8, fontWeight: 800, fontSize: 13, cursor: puedeAvanzarDesde(paso) ? "pointer" : "default", color: "#fff" }}>
            Agregar a mi cotización
          </button>
        )}
      </div>
    </div>
  );
}

function PuertasAsistente({ onAgregarExtra, idioma, productosDisponibles, listaCotizacion, onAgregar, onCambiar, t }) {

function FabricaTuPuerta({ onVolver, onAgregarExtra }) {
  const [paso, setPaso] = React.useState(0);
  const [tipo, setTipo] = React.useState(null);
  const [ancho, setAncho] = React.useState("");
  const [alto, setAlto] = React.useState("");
  const [acabado, setAcabado] = React.useState(null);
  const [acabadoOtroTexto, setAcabadoOtroTexto] = React.useState("");
  const [cantidad, setCantidad] = React.useState("");
  const [agregado, setAgregado] = React.useState(false);

  const nombresPasos = ["Tipo", "Medidas", "Acabado", "Cantidad"];
  const acabadoFinal = acabado === "Otro" ? acabadoOtroTexto.trim() : acabado;

  function reiniciar() {
    setPaso(0); setTipo(null); setAncho(""); setAlto(""); setAcabado(null); setAcabadoOtroTexto(""); setCantidad("");
  }

  function puedeAvanzarDesde(p) {
    if (p === 0) return !!tipo;
    if (p === 1) return ancho.trim() !== "" && alto.trim() !== "";
    if (p === 2) return acabado === "Otro" ? acabadoOtroTexto.trim() !== "" : !!acabado;
    if (p === 3) return cantidad !== "" && Number(cantidad) > 0;
    return false;
  }

  function agregarSeleccion() {
    const texto = `Puerta a medida — ${tipo} — ${ancho}x${alto}cm — ${acabadoFinal} — ${cantidad} unidad${Number(cantidad) !== 1 ? "es" : ""}`;
    onAgregarExtra(texto);
    setAgregado(true);
    setTimeout(() => { setAgregado(false); reiniciar(); }, 1800);
  }

  if (agregado) {
    return (
      <div style={{ textAlign: "center", padding: "30px 10px" }}>
        <div style={{ fontSize: 34, marginBottom: 6 }}>✓</div>
        <div style={{ fontWeight: 800, fontSize: 14 }}>Agregado a tu cotización</div>
      </div>
    );
  }

  return (
    <div>
      <button onClick={onVolver} style={{ background: "none", border: "none", color: COLOR.grafitoSuave, fontSize: 12, fontWeight: 700, cursor: "pointer", padding: 0, marginBottom: 12 }}>
        ← Puertas
      </button>
      <div style={{ display: "flex", alignItems: "center", gap: 3, marginBottom: 16, overflowX: "auto" }}>
        {nombresPasos.map((nombre, i) => (
          <React.Fragment key={nombre}>
            <div style={{ display: "flex", flexDirection: "column", alignItems: "center", flex: "0 0 auto", minWidth: 50 }}>
              <div style={{ width: 20, height: 20, borderRadius: "50%", display: "flex", alignItems: "center", justifyContent: "center", fontSize: 10, fontWeight: 800, background: i <= paso ? COLOR.amarillo : COLOR.borde, color: i <= paso ? COLOR.grafito : COLOR.grafitoSuave }}>
                {i + 1}
              </div>
              <div style={{ fontSize: 8, color: i === paso ? COLOR.grafito : COLOR.grafitoSuave, fontWeight: i === paso ? 800 : 400, marginTop: 2, textAlign: "center" }}>{nombre}</div>
            </div>
            {i < nombresPasos.length - 1 && <div style={{ flex: "1 1 12px", height: 2, background: i < paso ? COLOR.amarillo : COLOR.borde, marginBottom: 12 }} />}
          </React.Fragment>
        ))}
      </div>

      {paso === 0 && (
        <div>
          <FieldLabel>Tipo de puerta</FieldLabel>
          <div style={{ display: "flex", flexDirection: "column", gap: 6 }}>
            {TIPOS_PUERTA.map((tp) => (
              <OpcionRadio key={tp} seleccionado={tipo === tp} onClick={() => setTipo(tp)}>{tp}</OpcionRadio>
            ))}
          </div>
        </div>
      )}

      {paso === 1 && (
        <div>
          <FieldLabel>Medidas (ancho x alto, en cm)</FieldLabel>
          <div style={{ display: "flex", gap: 8, alignItems: "center" }}>
            <input type="number" min="0" value={ancho} onChange={(e) => setAncho(e.target.value)} placeholder="Ancho"
              style={{ flex: 1, padding: "9px 10px", border: `1px solid ${COLOR.borde}`, borderRadius: 8, fontSize: 13.5, boxSizing: "border-box" }} />
            <div style={{ color: COLOR.grafitoSuave }}>×</div>
            <input type="number" min="0" value={alto} onChange={(e) => setAlto(e.target.value)} placeholder="Alto"
              style={{ flex: 1, padding: "9px 10px", border: `1px solid ${COLOR.borde}`, borderRadius: 8, fontSize: 13.5, boxSizing: "border-box" }} />
          </div>
          <div style={{ fontSize: 10.5, color: COLOR.grafitoSuave, marginTop: 6 }}>Medida de hueco de obra habitual: 62.5 a 92.5cm de ancho, 203cm de alto.</div>
        </div>
      )}

      {paso === 2 && (
        <div>
          <FieldLabel>Acabado / color</FieldLabel>
          <div style={{ display: "flex", flexDirection: "column", gap: 6, marginBottom: 8 }}>
            {ACABADOS_PUERTA.map((a) => (
              <OpcionRadio key={a} seleccionado={acabado === a} onClick={() => setAcabado(a)}>{a}</OpcionRadio>
            ))}
            <OpcionRadio seleccionado={acabado === "Otro"} onClick={() => setAcabado("Otro")}>Otro (escribir)</OpcionRadio>
          </div>
          {acabado === "Otro" && (
            <input value={acabadoOtroTexto} onChange={(e) => setAcabadoOtroTexto(e.target.value)} placeholder="Describí el color/acabado"
              style={{ width: "100%", padding: "9px 10px", border: `1px solid ${COLOR.borde}`, borderRadius: 8, fontSize: 13.5, boxSizing: "border-box" }} autoFocus />
          )}
        </div>
      )}

      {paso === 3 && (
        <div>
          <FieldLabel>¿Cuántas puertas iguales necesitás?</FieldLabel>
          <input type="number" min="0" value={cantidad} onChange={(e) => setCantidad(e.target.value)} placeholder="Ej: 2"
            style={{ width: "100%", padding: "9px 10px", border: `1px solid ${COLOR.borde}`, borderRadius: 8, fontSize: 13.5, boxSizing: "border-box", marginBottom: 10 }} />
          <div style={{ background: COLOR.fondo, border: `1px solid ${COLOR.borde}`, borderRadius: 8, padding: 10, fontSize: 11.5, color: COLOR.grafitoSuave, lineHeight: 1.5 }}>
            <strong>Resumen:</strong> {tipo} · {ancho || "—"}x{alto || "—"}cm · {acabadoFinal}
          </div>
        </div>
      )}

      <div style={{ display: "flex", gap: 8, marginTop: 16 }}>
        {paso > 0 && (
          <button onClick={() => setPaso(paso - 1)} style={{ flex: "0 0 auto", padding: "10px 14px", background: "transparent", border: `1px solid ${COLOR.borde}`, borderRadius: 8, fontWeight: 700, fontSize: 13, cursor: "pointer" }}>
            Atrás
          </button>
        )}
        {paso < 3 ? (
          <button onClick={() => puedeAvanzarDesde(paso) && setPaso(paso + 1)} disabled={!puedeAvanzarDesde(paso)}
            style={{ flex: 1, padding: "10px 14px", background: puedeAvanzarDesde(paso) ? COLOR.amarillo : COLOR.borde, border: "none", borderRadius: 8, fontWeight: 800, fontSize: 13, cursor: puedeAvanzarDesde(paso) ? "pointer" : "default", color: COLOR.grafito }}>
            Siguiente
          </button>
        ) : (
          <button onClick={() => puedeAvanzarDesde(3) && agregarSeleccion()} disabled={!puedeAvanzarDesde(3)}
            style={{ flex: 1, padding: "10px 14px", background: puedeAvanzarDesde(3) ? "#2E7D32" : COLOR.borde, border: "none", borderRadius: 8, fontWeight: 800, fontSize: 13, cursor: puedeAvanzarDesde(3) ? "pointer" : "default", color: "#fff" }}>
            Agregar a mi cotización
          </button>
        )}
      </div>
    </div>
  );
}

  );

  const [agregado, setAgregado] = React.useState(false);

  const nombresPasos = ["Apertura", "Medidas", "Acabado", "Cristal", "Cantidad"];
  const acabadoFinal = acabado === "Otro" ? acabadoOtroTexto.trim() : acabado;

  function reiniciar() {
    setPaso(0); setApertura(null); setAncho(""); setAlto(""); setAcabado(null); setAcabadoOtroTexto(""); setCristal(null); setCantidad("");
  }

  function puedeAvanzarDesde(p) {
    if (p === 0) return !!apertura;
    if (p === 1) return ancho.trim() !== "" && alto.trim() !== "";
    if (p === 2) return acabado === "Otro" ? acabadoOtroTexto.trim() !== "" : !!acabado;
    if (p === 3) return !!cristal;
    if (p === 4) return cantidad !== "" && Number(cantidad) > 0;
    return false;
  }

  function agregarSeleccion() {
    const texto = `Ventana PVC a medida — ${apertura} — ${ancho}x${alto}cm — ${acabadoFinal} — Cristal: ${cristal} — ${cantidad} unidad${Number(cantidad) !== 1 ? "es" : ""}`;

    setAgregado(true);
    setTimeout(() => { setAgregado(false); reiniciar(); }, 1800);

  if (agregado) {
    return (
      <div style={{ textAlign: "center", padding: "30px 10px" }}>
        <div style={{ fontSize: 34, marginBottom: 6 }}>✓</div>
        <div style={{ fontWeight: 800, fontSize: 14 }}>Agregado a tu cotización</div>
      </div>
    );

  return (

            <div style={{ display: "flex", flexDirection: "column", alignItems: "center", flex: "0 0 auto", minWidth: 50 }}>
              <div style={{ width: 20, height: 20, borderRadius: "50%", display: "flex", alignItems: "center", justifyContent: "center", fontSize: 10, fontWeight: 800, background: i <= paso ? COLOR.amarillo : COLOR.borde, color: i <= paso ? COLOR.grafito : COLOR.grafitoSuave }}>
                {i + 1}
              </div>
              <div style={{ fontSize: 8, color: i === paso ? COLOR.grafito : COLOR.grafitoSuave, fontWeight: i === paso ? 800 : 400, marginTop: 2, textAlign: "center" }}>{nombre}</div>
            </div>
            {i < nombresPasos.length - 1 && <div style={{ flex: "1 1 12px", height: 2, background: i < paso ? COLOR.amarillo : COLOR.borde, marginBottom: 12 }} />}
          </React.Fragment>
        ))}
      </div>

      {paso === 0 && (
        <div>
          <FieldLabel>Tipo de apertura</FieldLabel>
          <div style={{ display: "flex", flexDirection: "column", gap: 6 }}>
            {TIPOS_APERTURA_VENTANA.map((tp) => (
              <OpcionRadio key={tp} seleccionado={apertura === tp} onClick={() => setApertura(tp)}>{tp}</OpcionRadio>

      {paso === 1 && (
        <div>
          <FieldLabel>Medidas (ancho x alto, en cm)</FieldLabel>
          <div style={{ display: "flex", gap: 8, alignItems: "center" }}>
            <input type="number" min="0" value={ancho} onChange={(e) => setAncho(e.target.value)} placeholder="Ancho"
              style={{ flex: 1, padding: "9px 10px", border: `1px solid ${COLOR.borde}`, borderRadius: 8, fontSize: 13.5, boxSizing: "border-box" }} />
            <div style={{ color: COLOR.grafitoSuave }}>×</div>
            <input type="number" min="0" value={alto} onChange={(e) => setAlto(e.target.value)} placeholder="Alto"
              style={{ flex: 1, padding: "9px 10px", border: `1px solid ${COLOR.borde}`, borderRadius: 8, fontSize: 13.5, boxSizing: "border-box" }} />
          </div>
        </div>
      )}

      {paso === 2 && (
        <div>
          <FieldLabel>Acabado / color</FieldLabel>
          <div style={{ display: "flex", flexDirection: "column", gap: 6, marginBottom: 8 }}>
            {ACABADOS_PVC.map((a) => (
              <OpcionRadio key={a} seleccionado={acabado === a} onClick={() => setAcabado(a)}>{a}</OpcionRadio>
            ))}
            <OpcionRadio seleccionado={acabado === "Otro"} onClick={() => setAcabado("Otro")}>Otro (escribir)</OpcionRadio>
          </div>
          {acabado === "Otro" && (
            <input value={acabadoOtroTexto} onChange={(e) => setAcabadoOtroTexto(e.target.value)} placeholder="Describí el color/acabado"
              style={{ width: "100%", padding: "9px 10px", border: `1px solid ${COLOR.borde}`, borderRadius: 8, fontSize: 13.5, boxSizing: "border-box" }} autoFocus />

      {paso === 3 && (
        <div>
          <FieldLabel>Tipo de cristal</FieldLabel>
          <div style={{ display: "flex", flexDirection: "column", gap: 6 }}>
            {CRISTALES_VENTANA.map((c) => (
              <OpcionRadio key={c} seleccionado={cristal === c} onClick={() => setCristal(c)}>{c}</OpcionRadio>
            ))}
          </div>
        </div>
      )}

      {paso === 4 && (
        <div>
          <FieldLabel>¿Cuántas ventanas iguales necesitás?</FieldLabel>
          <input type="number" min="0" value={cantidad} onChange={(e) => setCantidad(e.target.value)} placeholder="Ej: 3"
            style={{ width: "100%", padding: "9px 10px", border: `1px solid ${COLOR.borde}`, borderRadius: 8, fontSize: 13.5, boxSizing: "border-box", marginBottom: 10 }} />
          <div style={{ background: COLOR.fondo, border: `1px solid ${COLOR.borde}`, borderRadius: 8, padding: 10, fontSize: 11.5, color: COLOR.grafitoSuave, lineHeight: 1.5 }}>
            <strong>Resumen:</strong> {apertura} · {ancho || "—"}x{alto || "—"}cm · {acabadoFinal} · {cristal}
          </div>
        </div>
      )}

      <div style={{ display: "flex", gap: 8, marginTop: 16 }}>
        {paso > 0 && (
          <button onClick={() => setPaso(paso - 1)} style={{ flex: "0 0 auto", padding: "10px 14px", background: "transparent", border: `1px solid ${COLOR.borde}`, borderRadius: 8, fontWeight: 700, fontSize: 13, cursor: "pointer" }}>
            Atrás
          </button>
        )}
        {paso < 4 ? (
          <button onClick={() => puedeAvanzarDesde(paso) && setPaso(paso + 1)} disabled={!puedeAvanzarDesde(paso)}
            style={{ flex: 1, padding: "10px 14px", background: puedeAvanzarDesde(paso) ? COLOR.amarillo : COLOR.borde, border: "none", borderRadius: 8, fontWeight: 800, fontSize: 13, cursor: puedeAvanzarDesde(paso) ? "pointer" : "default", color: COLOR.grafito }}>
            Siguiente
          </button>
        ) : (
          <button onClick={() => puedeAvanzarDesde(4) && agregarSeleccion()} disabled={!puedeAvanzarDesde(4)}
            style={{ flex: 1, padding: "10px 14px", background: puedeAvanzarDesde(4) ? "#2E7D32" : COLOR.borde, border: "none", borderRadius: 8, fontWeight: 800, fontSize: 13, cursor: puedeAvanzarDesde(4) ? "pointer" : "default", color: "#fff" }}>
            Agregar a mi cotización
          </button>
        )}
      </div>
    </div>
  );
}
