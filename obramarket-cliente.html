function PinturaAsistente({ onAgregarExtra, idioma }) {
  const [paso, setPaso] = React.useState(0);
  const [tipo, setTipo] = React.useState(null); // Interior | Exterior | Especiales | Otro
  const [materialEspecial, setMaterialEspecial] = React.useState(null);
  const [materialEspecialOtroTexto, setMaterialEspecialOtroTexto] = React.useState("");
  const [tipoOtroTexto, setTipoOtroTexto] = React.useState("");
  const [color, setColor] = React.useState(null);
  const [colorOtroTexto, setColorOtroTexto] = React.useState("");
  const [cantidad, setCantidad] = React.useState("");
  const [modoCantidad, setModoCantidad] = React.useState("m2"); // "m2" o "litros"
  const [m2, setM2] = React.useState("");
  const [manos, setManos] = React.useState(2);
  const [nivel, setNivel] = React.useState(null);
  const [nivelOtroTexto, setNivelOtroTexto] = React.useState("");

  const RENDIMIENTO_M2_POR_LITRO = 10;
  const litrosCalculados = (parseFloat(m2) || 0) * manos / RENDIMIENTO_M2_POR_LITRO;
  const cantidadFinal = modoCantidad === "m2" ? litrosCalculados : parseFloat(cantidad) || 0;

  const [agregado, setAgregado] = React.useState(false);

  const paletaColor = tipo === "Exterior" ? COLORES_EXTERIOR : COLORES_INTERIOR;
  const nombresPasos = ["Tipo", "Color", "Cantidad", "Marca"];

  function reiniciar() {
    setPaso(0);
    setTipo(null);
    setMaterialEspecial(null);
    setTipoOtroTexto("");
    setColor(null);
    setColorOtroTexto("");
    setCantidad("");
    setModoCantidad("m2");
    setM2("");
    setManos(2);
    setNivel(null);
  }

  function puedeAvanzarDesde(p) {
    if (p === 0) return tipo === "Otro" ? tipoOtroTexto.trim() !== "" : tipo === "Especiales" ? (materialEspecial === "Otro" ? materialEspecialOtroTexto.trim() !== "" : !!materialEspecial) : !!tipo;
    if (p === 1) return !!color || colorOtroTexto.trim() !== "";
    if (p === 2) return cantidadFinal > 0;
    if (p === 3) return nivel === "Otro" ? nivelOtroTexto.trim() !== "" : !!nivel;
    return false;
  }

  function agregarSeleccion() {
    const materialFinal = materialEspecial === "Otro" ? materialEspecialOtroTexto.trim() : materialEspecial;
    const tipoTexto = tipo === "Especiales" ? `Especiales (${materialFinal})` : tipo === "Otro" ? tipoOtroTexto.trim() : tipo;
    const colorTexto = color || colorOtroTexto.trim();
    const nivelFinal = nivel === "Otro" ? nivelOtroTexto.trim() : nivel;
    const texto = `Pintura ${tipoTexto} — Color: ${colorTexto} — ${cantidadFinal.toFixed(1)}L — Calidad: ${nivelFinal}`;
    onAgregarExtra(texto);
    setAgregado(true);
    setTimeout(() => {
      setAgregado(false);
      reiniciar();
    }, 1800);
  }

  if (agregado) {
    return (
      <div style={{ textAlign: "center", padding: "30px 10px" }}>
        <div style={{ fontSize: 34, marginBottom: 6 }}>✓</div>
        <div style={{ fontWeight: 800, fontSize: 14 }}>Agregado a tu cotización</div>
      </div>
    );
  }

  return (
    <div>
      {/* Indicador de pasos */}
      <div style={{ display: "flex", alignItems: "center", gap: 4, marginBottom: 16 }}>
        {nombresPasos.map((nombre, i) => (
          <React.Fragment key={nombre}>
            <div style={{ display: "flex", flexDirection: "column", alignItems: "center", flex: 1 }}>
              <div
                style={{
                  width: 24,
                  height: 24,
                  borderRadius: "50%",
                  display: "flex",
                  alignItems: "center",
                  justifyContent: "center",
                  fontSize: 11,
                  fontWeight: 800,
                  background: i <= paso ? COLOR.amarillo : COLOR.borde,
                  color: i <= paso ? COLOR.grafito : COLOR.grafitoSuave,
                }}
              >
                {i + 1}
              </div>
              <div style={{ fontSize: 9.5, color: i === paso ? COLOR.grafito : COLOR.grafitoSuave, fontWeight: i === paso ? 800 : 400, marginTop: 2 }}>
                {nombre}
              </div>
            </div>
            {i < nombresPasos.length - 1 && <div style={{ flex: 1, height: 2, background: i < paso ? COLOR.amarillo : COLOR.borde, marginBottom: 14 }} />}
          </React.Fragment>
        ))}
      </div>

      {/* Paso 1: Tipo */}
      {paso === 0 && (
        <div>
          <FieldLabel>¿Qué tipo de pintura necesitás?</FieldLabel>
          <div style={{ display: "flex", flexDirection: "column", gap: 6, marginBottom: 12 }}>
            {["Interior", "Exterior", "Especiales", "Otro"].map((op) => (
              <OpcionRadio key={op} seleccionado={tipo === op} onClick={() => { setTipo(op); setMaterialEspecial(null); }}>
                {op === "Especiales" ? "Especiales (metal, madera, antioxidante)" : op === "Otro" ? "Otro (escribir)" : op}
              </OpcionRadio>
            ))}
          </div>
          {tipo === "Especiales" && (
            <div style={{ display: "flex", gap: 6, flexWrap: "wrap", marginBottom: 8 }}>
              {MATERIALES_ESPECIALES.map((m) => (
                <SubPill key={m} activo={materialEspecial === m} onClick={() => setMaterialEspecial(m)}>
                  {m}
                </SubPill>
              ))}
              <SubPill activo={materialEspecial === "Otro"} onClick={() => setMaterialEspecial("Otro")}>
                Otro
              </SubPill>
            </div>
          )}
          {tipo === "Especiales" && materialEspecial === "Otro" && (
            <input
              value={materialEspecialOtroTexto}
              onChange={(e) => setMaterialEspecialOtroTexto(e.target.value)}
              placeholder="Ej: PVC, cobre..."
              style={{ width: "100%", padding: "9px 10px", border: `1px solid ${COLOR.borde}`, borderRadius: 8, fontSize: 13.5, boxSizing: "border-box", marginBottom: 12 }}
              autoFocus
            />
          )}
          {tipo === "Otro" && (
            <input
              value={tipoOtroTexto}
              onChange={(e) => setTipoOtroTexto(e.target.value)}
              placeholder="Ej: impermeabilizante para terraza"
              style={{ width: "100%", padding: "9px 10px", border: `1px solid ${COLOR.borde}`, borderRadius: 8, fontSize: 13.5, boxSizing: "border-box", marginBottom: 12 }}
            />
          )}
        </div>
      )}

      {/* Paso 2: Color */}
      {paso === 1 && (
        <div>
          <FieldLabel>Elegí el color</FieldLabel>
          <div style={{ display: "flex", gap: 10, flexWrap: "wrap", marginBottom: 12 }}>
            {Object.entries(paletaColor).map(([nombre, hex]) => (
              <div
                key={nombre}
                onClick={() => { setColor(nombre); setColorOtroTexto(""); }}
                style={{ display: "flex", flexDirection: "column", alignItems: "center", width: 56, cursor: "pointer" }}
              >
                <div
                  style={{
                    width: 34,
                    height: 34,
                    borderRadius: "50%",
                    background: hex,
                    border: color === nombre ? `2px solid ${COLOR.ladrillo}` : `1px solid ${COLOR.grafitoSuave}`,
                    boxShadow: color === nombre ? `0 0 0 2px ${COLOR.amarillo}` : "none",
                    marginBottom: 4,
                  }}
                />
                <div style={{ fontSize: 9.5, color: COLOR.grafitoSuave, textAlign: "center", lineHeight: 1.2 }}>{nombre}</div>
              </div>
            ))}
          </div>
          <FieldLabel>¿No está tu color? Escribí la referencia</FieldLabel>
          <input
            value={colorOtroTexto}
            onChange={(e) => { setColorOtroTexto(e.target.value); if (e.target.value) setColor(null); }}
            placeholder="Ej: RAL 7016, o como la tengas anotada"
            style={{ width: "100%", padding: "9px 10px", border: `1px solid ${COLOR.borde}`, borderRadius: 8, fontSize: 13.5, boxSizing: "border-box" }}
          />
        </div>
      )}

      {/* Paso 3: Cantidad */}
      {paso === 2 && (
        <div>
          <FieldLabel>¿Cómo querés calcular la cantidad?</FieldLabel>
          <div style={{ display: "flex", gap: 6, marginBottom: 12 }}>
            <SubPill activo={modoCantidad === "m2"} onClick={() => setModoCantidad("m2")}>Por m² a pintar</SubPill>
            <SubPill activo={modoCantidad === "litros"} onClick={() => setModoCantidad("litros")}>Ya sé los litros</SubPill>

          {modoCantidad === "m2" ? (
            <div style={{ display: "flex", gap: 8, marginBottom: 10, flexWrap: "wrap" }}>
              <div style={{ flex: "1 1 120px" }}>
                <FieldLabel>Superficie a pintar (m²)</FieldLabel>
                <input
                  type="number"
                  min="0"
                  value={m2}
                  onChange={(e) => setM2(e.target.value)}
                  placeholder="Ej: 40"
                  style={{ width: "100%", padding: "9px 10px", border: `1px solid ${COLOR.borde}`, borderRadius: 8, fontSize: 13.5, boxSizing: "border-box" }}
                />
              </div>
              <div style={{ flex: "0 0 110px" }}>
                <FieldLabel>Manos de pintura</FieldLabel>
                <div style={{ display: "flex", gap: 4 }}>
                  {[1, 2].map((n) => (
                    <SubPill key={n} activo={manos === n} onClick={() => setManos(n)}>{n}</SubPill>

                value={cantidad}
                onChange={(e) => setCantidad(e.target.value)}
                placeholder="Ej: 12"
                style={{ width: "100%", padding: "9px 10px", border: `1px solid ${COLOR.borde}`, borderRadius: 8, fontSize: 13.5, boxSizing: "border-box" }}
              />
            </div>
          )}

          {modoCantidad === "m2" && Number(m2) > 0 && (
            <div style={{ background: COLOR.fondo, border: `1px solid ${COLOR.borde}`, borderRadius: 8, padding: "10px 12px", marginBottom: 8 }}>
              <div style={{ fontSize: 12, color: COLOR.grafitoSuave }}>Necesitás aprox.</div>
              <div style={{ fontSize: 15, fontWeight: 800 }}>{litrosCalculados.toFixed(1)}L</div>
            </div>
          )}
          <div style={{ fontSize: 10.5, color: COLOR.grafitoSuave, lineHeight: 1.4 }}>
            {modoCantidad === "m2"
              ? "Estimado con rendimiento habitual de ~10 m² por litro y mano. Puede variar según la pintura y la superficie."
              : "¿No sabes cuánto necesitas? Cambia a \"Por m² a pintar\" y lo calculamos por ti."}
          </div>
        </div>
      )}

      {/* Paso 4: Marca / nivel */}
      {paso === 3 && (
        <div>
          <FieldLabel>Nivel de calidad / marca</FieldLabel>
          <div style={{ display: "flex", flexDirection: "column", gap: 6, marginBottom: 8 }}>
            {NIVELES_PINTURA.map((n) => (
              <OpcionRadio key={n} seleccionado={nivel === n} onClick={() => setNivel(n)}>
                {n}
              </OpcionRadio>
            ))}
            <OpcionRadio seleccionado={nivel === "Otro"} onClick={() => setNivel("Otro")}>
              Otro (escribir)
            </OpcionRadio>
          </div>
          {nivel === "Otro" && (
            <input
              value={nivelOtroTexto}
              onChange={(e) => setNivelOtroTexto(e.target.value)}
              placeholder="Ej: marca específica que preferís"
              style={{ width: "100%", padding: "9px 10px", border: `1px solid ${COLOR.borde}`, borderRadius: 8, fontSize: 13.5, boxSizing: "border-box", marginBottom: 12 }}
              autoFocus
            />
          )}
          <div style={{ background: COLOR.fondo, border: `1px solid ${COLOR.borde}`, borderRadius: 8, padding: 10, fontSize: 12, color: COLOR.grafitoSuave, lineHeight: 1.4 }}>
            <strong>Resumen:</strong> {tipo === "Especiales" ? `Especiales (${(materialEspecial === "Otro" ? materialEspecialOtroTexto : materialEspecial) || "—"})` : tipo === "Otro" ? tipoOtroTexto || "—" : tipo} · {color || colorOtroTexto || "—"} · {cantidadFinal > 0 ? cantidadFinal.toFixed(1) : "—"}L
          </div>
        </div>
      )}

      {/* Navegación */}
      <div style={{ display: "flex", gap: 8, marginTop: 16 }}>
        {paso > 0 && (
          <button
            onClick={() => setPaso(paso - 1)}
            style={{ flex: "0 0 auto", padding: "10px 14px", background: "transparent", border: `1px solid ${COLOR.borde}`, borderRadius: 8, fontWeight: 700, fontSize: 13, cursor: "pointer" }}
          >
            Atrás
          </button>
        )}
        {paso < 3 ? (
          <button
            onClick={() => puedeAvanzarDesde(paso) && setPaso(paso + 1)}
            disabled={!puedeAvanzarDesde(paso)}
            style={{
              flex: 1,
              padding: "10px 14px",
              background: puedeAvanzarDesde(paso) ? COLOR.amarillo : COLOR.borde,
              border: "none",
              borderRadius: 8,
              fontWeight: 800,
              fontSize: 13,
              cursor: puedeAvanzarDesde(paso) ? "pointer" : "default",
              color: COLOR.grafito,
            }}
          >
            Siguiente
          </button>
        ) : (
          <button
            onClick={() => puedeAvanzarDesde(3) && agregarSeleccion()}
            disabled={!puedeAvanzarDesde(3)}
            style={{
              flex: 1,
              padding: "10px 14px",
              background: puedeAvanzarDesde(3) ? "#2E7D32" : COLOR.borde,
              border: "none",
              borderRadius: 8,
              fontWeight: 800,
              fontSize: 13,
              cursor: puedeAvanzarDesde(3) ? "pointer" : "default",
              color: "#fff",
            }}
          >
            Agregar a mi cotización
          </button>
        )}
      </div>
    </div>
  );
}

        </OpcionRadio>

function PasoProyecto({ proyecto, setProyecto, t, mercado }) {
  const [otroActivo, setOtroActivo] = React.useState(!t.tipos.includes(proyecto.tipo) && !!proyecto.tipo);
  const [otroTexto, setOtroTexto] = React.useState(otroActivo ? proyecto.tipo : "");
  return (
    <div>
      <StepTitle numero={2} titulo={t.paso1Titulo} t={t} />
      <FieldLabel>{t.tipoProyecto}</FieldLabel>
      <div style={{ display: "flex", flexDirection: "column", gap: 6, marginBottom: 8 }}>
        {t.tipos.map((tp) => (
          <OpcionRadio key={tp} seleccionado={!otroActivo && proyecto.tipo === tp} onClick={() => { setOtroActivo(false); setProyecto({ ...proyecto, tipo: tp }); }}>
            {tp}
          </OpcionRadio>
        ))}
        <OpcionRadio seleccionado={otroActivo} onClick={() => { setOtroActivo(true); setProyecto({ ...proyecto, tipo: otroTexto }); }}>
          Otro (escribir)
        </OpcionRadio>
      </div>
      {otroActivo && (
        <input
          value={otroTexto}
          onChange={(e) => { setOtroTexto(e.target.value); setProyecto({ ...proyecto, tipo: e.target.value }); }}

      <div style={{ marginBottom: 16 }} />
      <FieldLabel>{t.zonaLabel}</FieldLabel>
      <Campo placeholder={t.zonaPlaceholder} value={proyecto.zona} onChange={(v) => setProyecto({ ...proyecto, zona: v })} listId={mercado === "ES" ? "zonas-zaragoza" : null} />

        <datalist id="zonas-zaragoza">
          {ZONAS_ZARAGOZA.map((z) => (
            <option key={z} value={z} />
          ))}
        </datalist>
      )}
    </div>
  );
}

// Indicador visual del progreso del pedido: Enviada → Con precio → Aceptada → Pagada → Entregada
function ProgresoPedido({ estado }) {
  const pasos = ["enviada", "respondida", "aceptada", "pagada", "entregado"];
  const nombres = ["Enviada", "Con precio", "Aceptada", "Pagada", "Entregada"];
  const indiceActual = Math.max(pasos.indexOf(estado), 0);
  return (
    <div style={{ display: "flex", alignItems: "center", marginBottom: 10 }}>
      {pasos.map((p, i) => (
        <React.Fragment key={p}>
          <div
            title={nombres[i]}
            style={{
              width: 10,
              height: 10,
              borderRadius: "50%",
              background: i <= indiceActual ? COLOR.amarillo : COLOR.borde,
              flexShrink: 0,
            }}
          />
          {i < pasos.length - 1 && (
            <div style={{ flex: 1, height: 2, background: i < indiceActual ? COLOR.amarillo : COLOR.borde }} />
          )}
        </React.Fragment>
      ))}
    </div>
  );
}

// ---------- Red de seguridad: si algo falla, mostrar mensaje en vez de pantalla en blanco ----------
class RedDeSeguridad extends React.Component {
  constructor(props) {
    super(props);
    this.state = { error: null };
  }
  static getDerivedStateFromError(error) {
    return { error };
  }
  componentDidCatch(error, info) {
    console.error("Error atrapado por la red de seguridad:", error, info);
  }
  render() {
    if (this.state.error) {
      return (
        <div style={{ fontFamily: "Helvetica Neue, Arial, sans-serif", minHeight: "100vh", display: "flex", alignItems: "center", justifyContent: "center", padding: 24, background: "#EDE4D3" }}>
          <div style={{ maxWidth: 420, textAlign: "center" }}>
            <div style={{ fontSize: 40, marginBottom: 10 }}>⚠️</div>
            <div style={{ fontWeight: 800, fontSize: 17, marginBottom: 8 }}>Algo falló al procesar esto</div>
            <div style={{ fontSize: 13.5, color: "#7A6F62", marginBottom: 16 }}>
              No se perdió nada. Tocá el botón para volver a intentarlo.
            </div>
            <button
              onClick={() => window.location.reload()}
              style={{ padding: "10px 20px", background: "#F5B700", border: "none", borderRadius: 8, fontWeight: 800, fontSize: 14, cursor: "pointer" }}
            >
              Recargar página
            </button>
          </div>
        </div>
      );
    }
    return this.props.children;
  }
}

const root = ReactDOM.createRoot(document.getElementById("root"));
root.render(
  <RedDeSeguridad>
    <PlataformaCotizacion />
  </RedDeSeguridad>
);
